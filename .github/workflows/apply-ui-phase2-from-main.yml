name: Apply UI Phase 2 From Main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ui-phase2-from-main.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Checkout implementation branch
        run: |
          git fetch origin feat/ui-phase-2-results
          git checkout -B feat/ui-phase-2-results origin/feat/ui-phase-2-results

      - name: Patch frontend and native reports
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(app, "import Icon from './components/Icon.jsx'\n", "import Icon from './components/Icon.jsx'\nimport { ArtifactList, BatchStepRail, InspectionResult, getWorkspaceTemplate } from './components/ToolResultViews.jsx'\n", 'result view import')
          app = replace_once(app, "import { createRuntime } from './runtime/runtime.js'\n", "import { createRuntime } from './runtime/runtime.js'\nimport { canOpenArtifacts, openArtifactPath, revealArtifactPath } from './runtime/artifactActions.js'\n", 'artifact action import')
          app = replace_once(app, "  const notify = (message) => setToast(message)\n\n", "  const notify = (message) => setToast(message)\n\n  const openArtifact = async (artifact) => {\n    try {\n      await openArtifactPath(artifact.path)\n    } catch (error) {\n      notify(error.message)\n    }\n  }\n\n  const revealArtifact = async (artifact) => {\n    try {\n      await revealArtifactPath(artifact.path)\n    } catch (error) {\n      notify(error.message)\n    }\n  }\n\n", 'artifact handlers')
          app = replace_once(app, "            onCopy={async (content) => {\n              await copyText(content)\n              notify('已复制到剪贴板')\n            }}\n", "            onCopy={async (content) => {\n              await copyText(content)\n              notify('已复制到剪贴板')\n            }}\n            desktopArtifacts={canOpenArtifacts()}\n            onOpenArtifact={openArtifact}\n            onRevealArtifact={revealArtifact}\n", 'workspace artifact props')
          app = replace_once(app, "function ToolWorkspace({ tool, params, presets, favorite, runState, logs, runtimeMode, onBack, onParam, onFavorite, onRun, onCancel, onQueue, onExport, onSavePreset, onLoadPreset, onDeletePreset, onCopy }) {\n", "function ToolWorkspace({ tool, params, presets, favorite, runState, logs, runtimeMode, onBack, onParam, onFavorite, onRun, onCancel, onQueue, onExport, onSavePreset, onLoadPreset, onDeletePreset, onCopy, desktopArtifacts, onOpenArtifact, onRevealArtifact }) {\n", 'workspace signature')
          app = replace_once(app, "  const isTextTool = tool.id === 'json-formatter'\n", "  const template = getWorkspaceTemplate(tool)\n  const isTextTool = template === 'text'\n", 'workspace template')
          app = replace_once(app, "      <div className={`workspace-content ${isTextTool ? 'workspace-content--editor' : ''}`}>\n        {isTextTool ? (\n", "      <div className={`workspace-content workspace-content--${template} ${isTextTool ? 'workspace-content--editor' : ''}`}>\n        {template === 'batch' ? <BatchStepRail tool={tool} params={params} runState={runState} /> : null}\n        {isTextTool ? (\n", 'workspace content template')
          app = replace_once(app, "        <RunResult runState={runState} artifacts={artifacts} logs={logs} logsOpen={logsOpen} onToggleLogs={() => setLogsOpen((value) => !value)} onCopy={onCopy} />\n", "        <InspectionResult tool={tool} artifacts={artifacts} />\n        <RunResult\n          runState={runState}\n          artifacts={artifacts}\n          logs={logs}\n          logsOpen={logsOpen}\n          onToggleLogs={() => setLogsOpen((value) => !value)}\n          onCopy={onCopy}\n          desktopArtifacts={desktopArtifacts}\n          onOpenArtifact={onOpenArtifact}\n          onRevealArtifact={onRevealArtifact}\n        />\n", 'run result props')
          app = replace_once(app, "function RunResult({ runState, artifacts, logs, logsOpen, onToggleLogs, onCopy }) {\n", "function RunResult({ runState, artifacts, logs, logsOpen, onToggleLogs, onCopy, desktopArtifacts, onOpenArtifact, onRevealArtifact }) {\n", 'run result signature')
          old_artifacts = "      {artifacts.length ? <div className=\"artifact-grid\">{artifacts.map((artifact, index) => <article key={`${artifact.label}-${index}`}><span><Icon name={artifact.type === 'text' ? 'code' : artifact.type === 'directory' ? 'folder' : 'file'} /></span><div><strong>{artifact.label}</strong><small>{artifact.path ?? artifact.type}</small></div>{artifact.content ? <button onClick={() => onCopy(artifact.content)}><Icon name=\"copy\" />复制</button> : null}</article>)}</div> : null}\n"
          app = replace_once(app, old_artifacts, "      <ArtifactList artifacts={artifacts} desktop={desktopArtifacts} onCopy={onCopy} onOpen={onOpenArtifact} onReveal={onRevealArtifact} />\n", 'artifact list')
          app_path.write_text(app, encoding='utf-8')

          main_path = Path('src/main.jsx')
          main = main_path.read_text(encoding='utf-8')
          main = replace_once(main, "import './enhancements.css'\n", "import './enhancements.css'\nimport './phase2.css'\n", 'phase2 css import')
          main_path.write_text(main, encoding='utf-8')

          builtins_path = Path('src-tauri/src/builtins.rs')
          builtins = builtins_path.read_text(encoding='utf-8')
          builtins = replace_once(builtins, "#[derive(Debug)]\nstruct HttpCheckResult {\n    index: usize,\n", "#[derive(Debug, Clone, Serialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct HttpCheckResult {\n    #[serde(skip)]\n    index: usize,\n", 'http serialization')

          http_start = builtins.index('    let output_dir = run_output_dir(&request.run_id)?;', builtins.index('async fn run_http_batch_check'))
          http_marker = '    Ok(vec![file_artifact("HTTP 检测报告", &report)])\n'
          http_end = builtins.index(http_marker, http_start) + len(http_marker)
          http_block = '''    let success = rows.iter().filter(|result| (200..300).contains(&result.status)).count();
    let redirects = rows.iter().filter(|result| (300..400).contains(&result.status)).count();
    let failed = total.saturating_sub(success + redirects);
    let average_duration_ms = if rows.is_empty() { 0.0 } else { rows.iter().map(|result| result.duration_ms).sum::<f64>() / rows.len() as f64 };

    let output_dir = run_output_dir(&request.run_id)?;
    let report = output_dir.join("http-check-report.csv");
    write_csv(
        &report,
        &["url", "status", "duration_ms", "final_url", "error"],
        rows.iter().map(|result| vec![result.url.clone(), result.status.to_string(), format!("{:.2}", result.duration_ms), result.final_url.clone(), result.error.clone()]),
    )?;
    let payload = serde_json::json!({
        "kind": "http-check",
        "total": total,
        "success": success,
        "redirects": redirects,
        "failed": failed,
        "averageDurationMs": average_duration_ms,
        "rows": rows,
    });
    send_progress(request, on_event, 100, format!("检测完成：{total} 个 URL"), "success");
    Ok(vec![Artifact {
        kind: "file".to_string(),
        label: "HTTP 检测报告".to_string(),
        path: Some(report.to_string_lossy().to_string()),
        content: Some(payload.to_string()),
    }])
'''
          builtins = builtins[:http_start] + http_block + builtins[http_end:]

          git_start = builtins.index('    fs::write(&report, content)', builtins.index('fn run_git_audit'))
          git_marker = '    Ok(vec![file_artifact("Git 巡检报告", &report)])\n'
          git_end = builtins.index(git_marker, git_start) + len(git_marker)
          git_block = '''    fs::write(&report, content).map_err(|error| format!("写入 Git 巡检报告失败：{error}"))?;
    let payload = serde_json::json!({
        "kind": "git-audit",
        "repository": repository_path.to_string_lossy(),
        "branch": branch,
        "staleDays": stale_days,
        "clean": changed.is_empty(),
        "changed": changed,
        "staleBranches": stale_branches,
    });
    send_progress(request, on_event, 100, "Git 仓库巡检完成", "success");
    Ok(vec![Artifact {
        kind: "file".to_string(),
        label: "Git 巡检报告".to_string(),
        path: Some(report.to_string_lossy().to_string()),
        content: Some(payload.to_string()),
    }])
'''
          builtins = builtins[:git_start] + git_block + builtins[git_end:]
          builtins_path.write_text(builtins, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit feature branch
        run: |
          git rm -f .github/workflows/apply-ui-phase2.yml || true
          git add src/App.jsx src/main.jsx src-tauri/src/builtins.rs package-lock.json src-tauri/Cargo.lock
          git commit -m "feat: 完善批处理与检测结果工作区"
          git push origin HEAD:feat/ui-phase-2-results

      - name: Remove temporary workflow and placeholder files from main
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/apply-ui-phase2-from-main.yml
          git rm -f docs/ui-phase-2-implementation.md docs/.phase2-marker docs/.phase2-branch-note || true
          git commit -m "chore: 清理第二阶段临时执行文件"
          git push origin main
