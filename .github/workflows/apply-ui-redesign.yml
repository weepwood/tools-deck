name: Cleanup UI Redesign

on:
  push:
    branches:
      - feat/ui-workspace-redesign
    paths:
      - .github/workflows/apply-ui-redesign.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ui-workspace-redesign

      - name: Remove transfer files
        run: rm -rf .ui-redesign .github/workflows/apply-ui-redesign.yml

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: 清理 UI 重构临时文件"
          git push origin HEAD:feat/ui-workspace-redesign
