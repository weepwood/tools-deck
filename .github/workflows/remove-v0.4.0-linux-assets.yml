name: Remove v0.4.0 Linux Assets

on:
  push:
    branches:
      - chore/windows-macos-release-only
    paths:
      - .github/workflows/remove-v0.4.0-linux-assets.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/windows-macos-release-only

      - name: Remove Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in \
            "Tools.Deck-0.4.0-1.x86_64.rpm" \
            "Tools.Deck_0.4.0_amd64.AppImage" \
            "Tools.Deck_0.4.0_amd64.deb"
          do
            gh release delete-asset v0.4.0 "$asset" \
              --repo "${{ github.repository }}" \
              --yes || true
          done

      - name: Verify remaining release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.0 \
            --repo "${{ github.repository }}" \
            --json assets,tagName,url \
            > release-assets-after-cleanup.json

      - name: Commit verification result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-assets-after-cleanup.json
          git commit -m "ci: 记录 Linux 发布资产清理结果" || exit 0
          git push origin HEAD:chore/windows-macos-release-only
