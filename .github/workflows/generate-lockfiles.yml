name: Generate Lockfiles

on:
  push:
    branches:
      - review/release-v0.3.0
    paths:
      - .github/workflows/generate-lockfiles.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: review/release-v0.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: 锁定桌面发布依赖"
          git push origin HEAD:review/release-v0.3.0
