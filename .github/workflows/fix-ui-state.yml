name: Fix UI State

on:
  push:
    branches:
      - feat/ui-workspace-redesign
    paths:
      - .github/workflows/fix-ui-state.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ui-workspace-redesign

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ("    setLogs([])\n    setRunState(null)\n  }, [selectedTool?.id])", "    if (runState?.status !== 'running') {\n      setLogs([])\n      setRunState(null)\n    }\n  }, [selectedTool?.id])"),
            ("    if (nextParams) restoreRef.current = { toolId: tool.id, params: nextParams }\n    setSelectedId(tool.id)", "    if (nextParams) {\n      if (selectedId === tool.id) setParams(cloneValue(nextParams))\n      else restoreRef.current = { toolId: tool.id, params: nextParams }\n    }\n    setSelectedId(tool.id)"),
            ("    if (!selectedTool || !validateParams(selectedTool, params) || runState?.status === 'running') return", "    if (!selectedTool || !validateParams(selectedTool, params) || runState?.status === 'running') return\n    if (queueRunning) {\n      notify('任务队列正在运行，请先停止队列')\n      return\n    }"),
            ("    if (queueRunning) return\n    const tasks = queue.filter((item) => item.status === 'pending')", "    if (queueRunning) return\n    if (runState?.status === 'running') {\n      notify('当前工具正在运行，请等待完成或先停止任务')\n      return\n    }\n    const tasks = queue.filter((item) => item.status === 'pending')"),
            ("  const restoreHistory = (record) => {\n    const tool = tools.find((item) => item.id === record.toolId)\n    openTool(tool, record.params ?? getDefaultParams(tool))\n  }", "  const restoreHistory = (record) => {\n    const tool = tools.find((item) => item.id === record.toolId)\n    if (!tool) {\n      notify('对应工具已不存在')\n      return\n    }\n    openTool(tool, record.params ?? getDefaultParams(tool))\n  }"),
            ("  const latestRecord = history[0]\n\n  return (", "  const latestRecord = history[0]\n  const selectedRunState = runState?.toolId === selectedTool?.id ? runState : null\n  const selectedLogs = runState?.toolId === selectedTool?.id ? logs : []\n  const activeRunTool = tools.find((tool) => tool.id === runState?.toolId) ?? selectedTool\n\n  return ("),
            ("            runState={runState}\n            logs={logs}\n            runtimeMode={runtime.mode}", "            runState={selectedRunState}\n            logs={selectedLogs}\n            runtimeMode={runtime.mode}"),
            ("        selectedTool={selectedTool}\n        queueRunning={queueRunning}", "        selectedTool={activeRunTool}\n        queueRunning={queueRunning}"),
            ("              <button className=\"secondary-button\" onClick={() => onRestore(latestRecord)}>继续配置</button>\n              <button className=\"primary-button\" onClick={() => onRestore(latestRecord)}><Icon name=\"play\" />再次运行</button>", "              <button className=\"primary-button\" onClick={() => onRestore(latestRecord)}><Icon name=\"sliders\" />恢复参数</button>"),
            ("<footer>{activeItems.some((item) => item.status === 'pending') && !queueRunning ? <button className=\"primary-button\" onClick={onRunQueue}><Icon name=\"play\" />运行等待任务</button> : null}<button className=\"secondary-button\" onClick={onOpenTasks}>打开完整任务页</button></footer>", "<footer>{activeItems.some((item) => item.status === 'pending') && !queueRunning && runState?.status !== 'running' ? <button className=\"primary-button\" onClick={onRunQueue}><Icon name=\"play\" />运行等待任务</button> : null}<button className=\"secondary-button\" onClick={onOpenTasks}>打开完整任务页</button></footer>"),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected snippet not found: {old[:100]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-ui-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: 隔离工作区与任务队列运行状态"
          git push origin HEAD:feat/ui-workspace-redesign
